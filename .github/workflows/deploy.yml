name: Deploy to Contabo (aaPanel)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: SSH Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 62.169.23.170
          username: root
          key: ${{ secrets.ECOUSALIVE }}
          port: 22
          script: |
            set -e

            for DEPLOY_DIR in "/www/wwwroot/testecousa.deziner4you.com" "/www/wwwroot/ecousa.deziner4you.com"; do
              if [ -d "$DEPLOY_DIR" ]; then
                echo "==> Deploying to $DEPLOY_DIR..."
                cd "$DEPLOY_DIR"
                git config --global --add safe.directory "$DEPLOY_DIR"
                git remote remove origin 2>/dev/null || true
                git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
                git fetch origin main
                git reset --hard origin/main
                find "$DEPLOY_DIR" -type f -name "*.php" -exec chmod 644 {} \;
                find "$DEPLOY_DIR" -type d -exec chmod 755 {} \;
                echo "    Synced $DEPLOY_DIR successfully."
              fi
            done

            echo "==> Deploy complete!"
            echo "    Time: $(date '+%Y-%m-%d %H:%M:%S')"
