name: Deploy to Contabo (aaPanel)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: SSH Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 62.169.23.170
          username: root
          key: ${{ secrets.ECOUSALIVE }}
          port: 22
          script: |
            set -e

            DEPLOY_DIR="/www/wwwroot/testecousa.deziner4you.com"

            echo "==> Navigating to deploy directory..."
            cd "$DEPLOY_DIR"

            echo "==> Pulling latest code from GitHub..."
            git pull origin main

            echo "==> Setting file permissions..."
            find "$DEPLOY_DIR" -type f -name "*.php" -exec chmod 644 {} \;
            find "$DEPLOY_DIR" -type d -exec chmod 755 {} \;

            echo "==> Deploy complete!"
            echo "    Site: https://testecousa.deziner4you.com"
            echo "    Time: $(date '+%Y-%m-%d %H:%M:%S')"
